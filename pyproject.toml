[project]
name = "african-football-leagues-pipeline"
version = "1.0.0"
description = "Multi-source historical data pipeline for African domestic football leagues."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "playwright>=1.65.1",
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "apache-airflow>=3.1.8",
    "pre-commit>=4.7.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/african_football"]

[tool.pyright]
venvPath = "."
venv = ".venv"
