[project]
name = "african-football-leagues-pipeline"
version = "1.0.0"
description = "Multi-source historical data pipeline for African domestic football leagues."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "playwright>=1.65.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "apache-airflow>=3.1.8",
    "basedpyright>=1.40.2",
    "pre-commit>=4.7.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "sqlfluff>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: the test needs Postgres. It is skipped when DATABASE_URL is not set.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/african_football"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.sqlfluff.core]
dialect = "postgres"
max_line_length = 88
exclude_rules = "RF04"

[tool.sqlfluff.layout.type.data_type]
spacing_before = "align"
align_within = "create_table_statement"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.types]
extended_capitalisation_policy = "lower"
