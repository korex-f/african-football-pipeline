name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this tag the same as the Playwright version in uv.lock
      image: mcr.microsoft.com/playwright/python:v1.65.1-noble
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: football
        options: >-
          --health-cmd "pg_isready -U pipeline -d football"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 10s
    env:
      DATABASE_URL: postgresql://pipeline:pipeline@postgres:5432/football
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright browsers
        run: uv run playwright install chromium

      - name: Apply migrations
        run: uv run python -m african_football.db.migrate

      - name: Run tests
        run: uv run pytest


  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Check types
        run: uv run basedpyright

      - name: Check SQL linting
        run: uv run sqlfluff lint src/african_football/db/migrations
