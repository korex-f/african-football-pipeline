services:
  pipeline-db:
    image: postgres:18
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: football
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pipeline-db-volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pipeline", "-d", "football"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pipeline-db-volume:
    name: african-football-pipeline-db
